# ─────────────────────────────────────────────────────────────
# JustSaid — Gradle project properties.
# ─────────────────────────────────────────────────────────────

# Required for AndroidX (Jetpack, Compose, Room, etc.).
android.useAndroidX=true

# JVM args: raise heap for NDK/CMake builds of whisper.cpp + llama.cpp.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Kotlin official code style.
kotlin.code.style=official

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true

# Only generate the R class fields a module actually uses (smaller, faster).
android.nonTransitiveRClass=true
